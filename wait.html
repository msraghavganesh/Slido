<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waiting for Poll</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --text: #f4f4f5;
      --muted: #c6c6ca;
      --muted-2: #8f8f93;
      --border: rgba(255, 255, 255, 0.10);
      --green: #1f8f3b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 72%, rgba(255,255,255,0.04) 0, rgba(255,255,255,0.025) 17%, transparent 18%),
        radial-gradient(circle at 76% 14%, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.02) 28%, transparent 29%),
        linear-gradient(90deg, #0d0e10 0%, #121316 38%, #18181b 100%);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      position: relative;
      min-height: 100vh;
    }

    .bg-shape {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .shape-left {
      width: 620px;
      height: 620px;
      left: -210px;
      bottom: -120px;
      background: rgba(255, 255, 255, 0.03);
    }

    .shape-center {
      width: 860px;
      height: 860px;
      left: 14%;
      top: 8%;
      background: rgba(255, 255, 255, 0.022);
    }

    .shape-right {
      width: 980px;
      height: 980px;
      right: -280px;
      top: -140px;
      background: rgba(255, 255, 255, 0.024);
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 56px 36px 48px;
      border-radius: 28px;
      border: 1px solid var(--border);
      background: linear-gradient(
        180deg,
        rgba(15, 16, 18, 0.96) 0%,
        rgba(15, 16, 18, 0.90) 100%
      );
      backdrop-filter: blur(10px);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
      text-align: center;
    }

    .logo {
      font-size: 31px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #18a64a;
      margin: 0 0 28px;
      user-select: none;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      margin: 0 auto 18px;
    }

    .title {
      margin: 0 0 14px;
      font-size: 30px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: #f5f5f6;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 360px;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.55;
      letter-spacing: 0.005em;
      color: var(--muted);
    }

    .loader {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.10);
      border-top-color: var(--green);
      margin: 30px auto 0;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 21px;
      z-index: 1;
      text-align: center;
      color: var(--muted-2);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: -0.005em;
      padding: 0 16px;
    }

    .footer a {
      color: #bdbdbf;
      text-decoration: none;
      margin: 0 2px;
    }

    .footer a:hover {
      color: #ffffff;
    }

    @media (max-width: 640px) {
      .page {
        padding: 18px;
      }

      .card {
        max-width: 100%;
        padding: 42px 24px 38px;
        border-radius: 24px;
      }

      .logo {
        font-size: 29px;
        margin-bottom: 24px;
      }

      .title {
        font-size: 24px;
        line-height: 1.2;
      }

      .subtitle {
        font-size: 15px;
        max-width: 290px;
      }

      .shape-left {
        width: 430px;
        height: 430px;
        left: -180px;
        bottom: -70px;
      }

      .shape-center {
        width: 560px;
        height: 560px;
        left: 8%;
        top: 18%;
      }

      .shape-right {
        width: 640px;
        height: 640px;
        right: -230px;
        top: -50px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-shape shape-left"></div>
  <div class="bg-shape shape-center"></div>
  <div class="bg-shape shape-right"></div>

  <main class="page">
    <section class="card">
      <div class="logo">slido</div>

      <div class="status-dot"></div>

      <h1 class="title">Wait for host to start the poll</h1>
      <p class="subtitle">
        You’ve joined successfully. The poll will appear here once the host starts it.
      </p>

      <div class="loader" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="footer">
    <div>
      <a href="#">Acceptable Use</a> –
      <a href="#">Privacy</a> –
      <a href="#">Cookie Settings</a>
    </div>
    <div>© 2012–2026 Your Brand</div>
  </footer>
</body>
</html>
