<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slido Join Page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #0d0e10;
      --bg-deep: #111214;
      --card: rgba(16, 17, 19, 0.92);
      --border: rgba(255, 255, 255, 0.10);
      --text: #f4f4f5;
      --muted: #bdbdbf;
      --muted-2: #89898d;
      --line: rgba(255, 255, 255, 0.72);
      --green: #1f8f3b;
      --green-hover: #187330;
      --green-active: #15672b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 9% 70%, rgba(255,255,255,0.04) 0, rgba(255,255,255,0.03) 16%, transparent 17%),
        radial-gradient(circle at 74% 14%, rgba(255,255,255,0.035) 0, rgba(255,255,255,0.025) 28%, transparent 29%),
        linear-gradient(90deg, #0d0e10 0%, #121316 38%, #18181b 100%);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: "cv11", "ss01";
    }

    body {
      position: relative;
      min-height: 100vh;
    }

    /* Background decorative circles */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .shape-left {
      width: 610px;
      height: 610px;
      left: -190px;
      bottom: -105px;
      background: rgba(255, 255, 255, 0.03);
    }

    .shape-center {
      width: 820px;
      height: 820px;
      left: 19%;
      top: 10%;
      background: rgba(255, 255, 255, 0.022);
    }

    .shape-right {
      width: 980px;
      height: 980px;
      right: -290px;
      top: -155px;
      background: rgba(255, 255, 255, 0.024);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 96px;
      position: relative;
      z-index: 1;
    }

    .card {
      width: 100%;
      max-width: 402px;
      min-height: 474px;
      border-radius: 28px;
      border: 1px solid var(--border);
      background: linear-gradient(
        180deg,
        rgba(15, 16, 18, 0.96) 0%,
        rgba(15, 16, 18, 0.90) 100%
      );
      backdrop-filter: blur(10px);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
      padding: 42px 32px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .logo {
      font-family: "Inter", sans-serif;
      font-size: 31px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.01em;
      color: #18a64a;
      margin: 0 0 28px;
      user-select: none;
    }

    .welcome {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600; 
      line-height: 1.3;
      letter-spacing: -0.012em;
      color: #d6d6d8;
    }

    .event-name {
      margin: 0 0 10px;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.005em;
      color: #f5f5f6;
    }

    .event-date {
      margin: 0 0 42px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.012em;
      color: #cacace;
    }

    .form {
      width: 100%;
      margin-top: 0;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.70);
      padding: 7px 2px 11px;
      margin-bottom: 64px;
      transition: border-color 0.18s ease;
    }

    .input-wrap:focus-within {
      border-bottom-color: rgba(255, 255, 255, 0.92);
    }

    .input-icon {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      opacity: 0.55;
      transform: translateY(-1px);
    }

    .input-wrap input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: #f7f7f8;
      font-family: "Inter", sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.4;
      padding: 0;
    }

    .input-wrap input::placeholder {
      color: #c6c6ca;
      opacity: 1;
      font-weight: 500;
    }

    .join-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 8px;
      background: var(--green);
      color: #dddcdc;
      font-family: "Inter", sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.015em;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.08s ease, box-shadow 0.18s ease;
      /* box-shadow: 0 6px 14px rgba(31, 143, 59, 0.22); */
      box-shadow: none;
    }

    .join-btn:hover {
      background: var(--green-hover);
      box-shadow: 0 8px 18px rgba(31, 143, 59, 0.26);
    }

    .join-btn:active {
      background: var(--green-active);
      transform: translateY(1px);
    }

    .secondary-link {
      display: inline-block;
      margin-top: 26px;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: #d4d4d8;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.35;
      transition: color 0.18s ease;
    }

    .secondary-link:hover {
      color: #ffffff;
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 21px;
      z-index: 1;
      text-align: center;
      color: var(--muted-2);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: -0.005em;
      padding: 0 16px;
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      margin: 0 2px;
      transition: color 0.18s ease;
    }

    .footer a:hover {
      color: #ffffff;
    }

    .copyright {
      font-size: 12px;
      color: #8f8f93;
    }

    @media (max-width: 640px) {
      .page {
        padding: 20px 16px 96px;
      }

      .card {
        max-width: 100%;
        min-height: auto;
        padding: 34px 22px 26px;
        border-radius: 24px;
      }

      .logo {
        font-size: 29px;
        margin-bottom: 24px;
      }

      .event-name {
        font-size: 20px;
        letter-spacing: 2em;
      }

      .event-date {
        margin-bottom: 34px;
      }

      .input-wrap {
        margin-bottom: 52px;
      }

      .shape-left {
        width: 430px;
        height: 430px;
        left: -180px;
        bottom: -60px;
      }

      .shape-center {
        width: 560px;
        height: 560px;
        left: 9%;
        top: 20%;
      }

      .shape-right {
        width: 640px;
        height: 640px;
        right: -230px;
        top: -50px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-shape shape-left"></div>
  <div class="bg-shape shape-center"></div>
  <div class="bg-shape shape-right"></div>

  <main class="page">
    <section class="card" aria-label="Event join card">
      <div class="content">
        <div class="logo">slido</div>

        <p class="welcome">Welcome to</p>
        <h1 class="event-name">CPM Safety Moment</h1>
        <p class="event-date">Jun 10 – 12, 2026</p>

        <form class="form" onsubmit="return false;">
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v1h16v-1c0-2.761-3.582-5-8-5Z"
                stroke="rgba(255,255,255,0.52)"
                stroke-width="1.5"
              />
            </svg>
            <input type="text" placeholder="Full name *" aria-label="Full name" />
          </div>

          <button class="join-btn" type="submit">Join slido</button>
        </form>

        <a class="secondary-link" href="#">Back to search</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div>
      <a href="#">Acceptable Use</a> –
      <a href="#">Privacy</a> –
      <a href="#">Cookie Settings</a>
    </div>
    <div class="copyright">© 2012–2026 Your Brand</div>
  </footer>
</body>
</html>
